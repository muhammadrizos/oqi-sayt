# Pages CMS sozlamasi — https://app.pagescms.org
# Kitoblar ro'yxati shu fayl orqali tahrirlanadi: data/books.json

media:
  input: assets
  output: /assets

content:
  - name: books
    label: Kitoblar
    type: file
    path: data/books.json
    format: json
    list: true
    fields:
      - name: id
        label: ID (lotin harflar, chiziqcha bilan)
        type: string
        required: true
      - name: title
        label: Nomi
        type: string
        required: true
      - name: original
        label: Asl nomi
        type: string
      - name: author
        label: Muallif
        type: string
        required: true
      - name: authorFull
        label: Muallif to'liq (yillari bilan)
        type: string
      - name: year
        label: Yil
        type: number
      - name: genre
        label: Janr (roman / ertak / drama / sarguzasht / detektiv / fantastika / sheriyat)
        type: string
      - name: lang
        label: Til (uz / ru / en)
        type: string
      - name: pages
        label: Sahifalar soni
        type: number
      - name: desc
        label: Tavsif
        type: text
      - name: cover
        label: Muqova ranglari
        type: object
        fields:
          - name: c1
            label: Asosiy rang (masalan #f5c62b)
            type: string
          - name: c2
            label: Ikkinchi rang (masalan #e0a516)
            type: string
          - name: ink
            label: To'q matn kerakmi (faqat och muqovalar uchun)
            type: string
      - name: license
        label: Huquq holati (public-domain / licensed / checking)
        type: string
      - name: source
        label: Manba
        type: string
      - name: added
        label: Qo'shilgan tartibi (kichik raqam = yangi)
        type: number
      - name: popularity
        label: Ommaboplik (0–100)
        type: number
      - name: textKind
        label: Matn holati (full / sample / pending)
        type: string
