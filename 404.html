<!DOCTYPE html>
<html lang="uz-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahifa topilmadi — O'QI</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<style>
  :root{color-scheme:light;--paper:#fdfbf4;--ink:#1e1b16;--ink-2:#57503f;--accent:#f5c62b;--on:#1a160e}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       background:var(--paper);color:var(--ink);
       font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
  .box{text-align:center;padding:40px 24px;max-width:440px}
  .mark{width:120px;margin:0 auto 26px;display:block}
  h1{font-family:"Palatino Linotype",Georgia,serif;font-size:30px;margin:0 0 10px;letter-spacing:-.01em}
  p{color:var(--ink-2);font-size:15px;line-height:1.6;margin:0 0 24px}
  a{display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:11px;
    background:var(--accent);color:var(--on);text-decoration:none;font-weight:600;font-size:14px}
  a:active{transform:scale(.97)}
</style>
</head>
<body>
  <div class="box">
    <img class="mark" src="/assets/oqi-wordmark.png" alt="O'QI">
    <h1>Bu sahifa topilmadi</h1>
    <p>Havola eskirgan yoki manzil xato yozilgan bo'lishi mumkin. Katalogga qaytib, kitobni qaytadan tanlang.</p>
    <a href="/">Bosh sahifaga qaytish</a>
  </div>
</body>
</html>
